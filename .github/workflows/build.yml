name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # macOS minutes are exhausted on this account (jobs are cancelled within
    # seconds); Linux runners bill at 1x and are still available.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos (Linux)
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$HOME/theos"
          export THEOS="$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          "$HOME/theos/bin/install-theos"

      - name: Show environment
        run: |
          set -e
          "$THEOS/toolchain/linux/iphone/bin/clang" --version | head -2
          ls "$THEOS/sdks"

      - name: Build package
        run: |
          set -eo pipefail
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tail -200

      - name: Inspect result
        run: |
          set -e
          ls -la packages/
          for f in packages/*.deb; do
            [ -e "$f" ] || { echo "NO DEB PRODUCED"; exit 1; }
            echo "--- $f"
            echo "SIZE=$(wc -c < "$f") SHA256=$(sha256sum "$f" | cut -d' ' -f1)"
            ar t "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: folderx-deb
          path: packages/*.deb
          if-no-files-found: error
